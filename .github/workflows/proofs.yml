name: proofs

on: push

jobs:
  octave:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y octave
      - name: Run RED/GREEN proofs
        run: octave --no-gui --eval "cd proofs; run_proofs('exit')"

  matlab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: cd proofs; run_proofs('exit')
